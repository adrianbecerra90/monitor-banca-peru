<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · Monitor Banca Perú</title>
<style>
:root{--bg:#f4f4f2;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7974;--line:#e3e2de;--acc:#2a78d6;--neg:#d6453a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#8f8e88;--line:#2e2e2b;--acc:#3987e5;--neg:#e5584c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#8f8e88;--line:#2e2e2b;--acc:#3987e5;--neg:#e5584c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
.caja{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:19px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:grid;gap:4px;font-size:13px;color:var(--ink2);margin-bottom:12px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{width:100%;font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px;background:var(--acc);color:#fff;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:wait}
.error{color:var(--neg);font-size:13px;min-height:20px;margin-top:10px}
.ayuda{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<main class="caja">
  <h1>Monitor de banca · Perú</h1>
  <p class="sub" id="sub">Inicia sesión para continuar</p>
  <form id="f" autocomplete="on">
    <div id="campo-nombre" hidden><label>Tu nombre<input id="nombre" autocomplete="name" maxlength="60"></label></div>
    <label>Usuario<input id="usuario" autocomplete="username" required maxlength="32" autocapitalize="none" spellcheck="false"></label>
    <label>Contraseña<input id="clave" type="password" autocomplete="current-password" required maxlength="128"></label>
    <div id="campo-clave2" hidden><label>Repite la contraseña<input id="clave2" type="password" autocomplete="new-password" maxlength="128"></label></div>
    <button id="btn">Entrar</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <p class="ayuda" id="ayuda"></p>
</main>
<script>
const $=s=>document.querySelector(s);
let inicial=false;
(async()=>{
  const s=await fetch('/api/sesion').then(r=>r.json());
  if(s.autenticado){location.replace('/');return}
  if(s.configuracion_inicial){
    if(!s.puede_configurar){$('#sub').textContent='El monitor aún no tiene cuentas. El administrador debe crearlas desde el equipo donde está instalado.';$('#f').hidden=true;return}
    inicial=true;$('#sub').textContent='Primera vez: crea la cuenta de administrador';$('#campo-nombre').hidden=false;$('#campo-clave2').hidden=false;
    $('#clave').autocomplete='new-password';$('#btn').textContent='Crear administrador y entrar';
    $('#ayuda').textContent='Usuario: 3 a 32 caracteres en minúsculas. Contraseña: al menos 10 caracteres, con letras y números.'}
  $('#usuario').focus()})();
$('#f').onsubmit=async e=>{
  e.preventDefault();$('#error').textContent='';
  if(inicial&&$('#clave').value!==$('#clave2').value){$('#error').textContent='Las contraseñas no coinciden';return}
  $('#btn').disabled=true;
  try{
    const r=await fetch(inicial?'/api/configuracion-inicial':'/api/login',{method:'POST',headers:{'X-Monitor':'1','Content-Type':'application/json'},
      body:JSON.stringify({usuario:$('#usuario').value.trim().toLowerCase(),clave:$('#clave').value,nombre:$('#nombre').value})});
    const d=await r.json();
    if(r.ok){location.replace('/');return}
    $('#error').textContent=d.error||'No se pudo iniciar sesión';$('#clave').value='';$('#clave').focus()
  }catch(err){$('#error').textContent='Sin conexión con el monitor'}
  $('#btn').disabled=false};
</script>
</body>
</html>
